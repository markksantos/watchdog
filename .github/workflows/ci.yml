name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble .app bundle
        run: bash scripts/build-app.sh

      - name: Verify bundle
        run: |
          test -f build/Watchdog.app/Contents/MacOS/Watchdog
          test -f build/Watchdog.app/Contents/Info.plist
          test -f build/Watchdog.app/Contents/Resources/AppIcon.icns
          file build/Watchdog.app/Contents/MacOS/Watchdog
